name: identity-service
services:
  
  identity-database:
  
    image: postgres:16

    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}

    ports:
      - "${IDENTITY_DB_PORT:-5432}:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
